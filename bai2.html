<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <br>
    <!-- <br>: Có tác dụng là ngắt dòng, thường được dùng để xuống dòng -->
    <hr>
    <!-- <hr>: Có tác dụng là tạo một đường ngang phân cách, thường được dùng để chia tách các phần nội dung -->
    <b></b>
    <!-- <b>: Có tác dụng là in đậm, thường được dùng để nhấn mạnh một số từ hoặc cụm từ -->
    <i></i>
    <!-- <i>: Có tác dụng là in nghiêng, thường được dùng để nhấn mạnh một số từ hoặc cụm từ -->
    <u></u>
    <!-- <u>: Có tác dụng là gạch chân, thường được dùng để nhấn mạnh một số từ hoặc cụm từ -->
   
    <p>
    <b>lorem ipsum dolor sit amet</b> <br>
    <i>lorem ipsum dolor sit amet</i> <br>
    <u>lorem ipsum dolor sit amet</u> <hr>
    <u><i><b>lorem ipsum dolor sit amet</b></i></u> <hr>
    </p>
</body>
</html>
